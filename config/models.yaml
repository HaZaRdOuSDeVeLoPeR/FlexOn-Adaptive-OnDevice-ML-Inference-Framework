# Model/runtime configuration used by the generic offline profiling pipeline.
# Model-specific input shapes may be supplied under runtime.input_shapes when
# the ONNX graph contains dynamic dimensions other than the batch dimension.
models:
  - name: resnet18
    path: models/resnet18-v1-7.onnx

  - name: efficientnet_lite4
    path: models/efficientnet-lite4-11.onnx

  - name: yolov4_tiny
    path: models/yolov4-tiny-416.onnx

runtime:
  batch_size: 1
  static_shapes_only: true
  # Optional exact shapes keyed by ONNX graph input name.
  # input_shapes:
  #   input_name: [1, 3, 224, 224]
  input_shapes: {}

  # Set this to a positive value to use it for unresolved dynamic dimensions
  # other than the first (batch) dimension. Zero means "do not guess".
  dynamic_dimension_default: 0
